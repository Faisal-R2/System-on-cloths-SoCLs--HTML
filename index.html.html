<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embroidery PCB Designer</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #toolbar { padding: 10px; background: #2c3e50; color: white; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        button, select { padding: 6px 12px; border: none; border-radius: 4px; background: #ecf0f1; cursor: pointer; font-size: 14px; font-weight: 500; outline: none; }
        button:hover, select:hover { background: #bdc3c7; }
        button.active { background: #3498db; color: white; }
        .separator { width: 1px; height: 24px; background: #7f8c8d; margin: 0 5px; }
        #workspace { display: flex; flex: 1; overflow: hidden; background: #bdc3c7; }
        #canvas-wrapper { flex: 1; overflow: hidden; position: relative; cursor: crosshair; }
        canvas { display: block; background: #ffffff; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        #statusbar { padding: 5px 10px; background: #ecf0f1; font-size: 12px; border-top: 1px solid #bdc3c7; color: #2c3e50; font-weight: bold; }
        .btn-export { background: #27ae60 !important; color: white; }
        .btn-export:hover { background: #2ecc71 !important; }
        .btn-danger { background: #e74c3c !important; color: white; }
    </style>
</head>
<body>

    <div id="toolbar">
        <button id="btn-new">New</button>
        <button id="btn-save">Save JSON</button>
        <button id="btn-load" onclick="document.getElementById('file-input').click()">Load JSON</button>
        <input type="file" id="file-input" style="display: none;" accept=".json,.embpcb">
        
        <div class="separator"></div>
        <button class="tool-btn active" data-tool="select">Select / Move</button>
        <div class="separator"></div>
        
        <button class="tool-btn" data-tool="place_R1210">R1210</button>
        <button class="tool-btn" data-tool="place_C1210">C1210</button>
        <button class="tool-btn" data-tool="place_SOIC8">SOIC8</button>
        <button class="tool-btn" data-tool="place_DIP8">DIP8</button>
        <button class="tool-btn" data-tool="place_PAD8">Pad (8mm)</button>
        <button class="tool-btn" data-tool="place_EmbR">Emb. Resistor</button>
        <button class="tool-btn" data-tool="place_EmbC">Emb. Capacitor</button>
        
        <div class="separator"></div>
        <button class="tool-btn" data-tool="route">Route Trace</button>
        <select id="grid-select">
            <option value="0.5">Grid: 0.5 mm</option>
            <option value="1.0" selected>Grid: 1.0 mm</option>
            <option value="1.27">Grid: 1.27 mm</option>
            <option value="2.5">Grid: 2.5 mm</option>
        </select>
        <button id="btn-rotate">Rotate 90°</button>
        <button id="btn-delete" class="btn-danger">Delete Selected</button>
        
        <div class="separator"></div>
        <button id="btn-export-dst" class="btn-export">Export .DST</button>
    </div>

    <div id="workspace">
        <div id="canvas-wrapper">
            <canvas id="pcbCanvas"></canvas>
        </div>
    </div>

    <div id="statusbar">Tool: Select | Grid: 1.0mm | Zoom: 8.0x | Press 'R' to swap trace routing direction</div>

<script>
const CONFIG = {
    BOARD_W_MM: 235, BOARD_H_MM: 135, GRID_MM: 1.0, SCALE: 8, MIN_SCALE: 1, MAX_SCALE: 50,
    COLORS: { TRACE: "maroon", PAD_FILL: "goldenrod", PAD_OUTLINE: "darkgoldenrod", BODY_FILL: "khaki", BODY_OUTLINE: "saddlebrown", SELECTED: "deepskyblue", GRID: "#e0e0e0", ROUTING: "purple" }
};

const FOOTPRINTS = {
    "R1210": { size: [3.2, 1.6], pads: [{n: "1", size: [2.5, 2.5], rel: [-2.0, 0]}, {n: "2", size: [2.5, 2.5], rel: [2.0, 0]}] },
    "C1210": { size: [3.2, 2.5], pads: [{n: "1", size: [2.5, 2.5], rel: [-2.0, 0]}, {n: "2", size: [2.5, 2.5], rel: [2.0, 0]}] },
    "SOIC8": { size: [4.9, 3.9], pads: [{n: "1", size: [0.6, 1.75], rel: [-1.905, -2.7]}, {n: "2", size: [0.6, 1.75], rel: [-0.635, -2.7]}, {n: "3", size: [0.6, 1.75], rel: [0.635, -2.7]}, {n: "4", size: [0.6, 1.75], rel: [1.905, -2.7]}, {n: "5", size: [0.6, 1.75], rel: [1.905, 2.7]}, {n: "6", size: [0.6, 1.75], rel: [0.635, 2.7]}, {n: "7", size: [0.6, 1.75], rel: [-0.635, 2.7]}, {n: "8", size: [0.6, 1.75], rel: [-1.905, 2.7]}]},
    "DIP8": { size: [9.5, 9.5], pads: [{n: "1", size: [1.54, 1.54], rel: [-3.81, -3.81]}, {n: "2", size: [1.54, 1.54], rel: [-1.27, -3.81]}, {n: "3", size: [1.54, 1.54], rel: [1.27, -3.81]}, {n: "4", size: [1.54, 1.54], rel: [3.81, -3.81]}, {n: "5", size: [1.54, 1.54], rel: [3.81, 3.81]}, {n: "6", size: [1.54, 1.54], rel: [1.27, 3.81]}, {n: "7", size: [1.54, 1.54], rel: [-1.27, 3.81]}, {n: "8", size: [1.54, 1.54], rel: [-3.81, 3.81]}]},
    "PAD8": { size: [8, 8], pads: [{n: "1", size: [8, 8], rel: [0, 0]}]}
};

let state = { 
    components: [], traces: [], tool: 'select', selected: new Set(), clipboard: [], 
    routingStartNode: null, routeMode: 0, mousePx: {x: 0, y: 0}, offsetX: 0, offsetY: 0, scale: CONFIG.SCALE,
    undoStack: [], redoStack: [] 
};

document.getElementById('grid-select').addEventListener('change', e => {
    CONFIG.GRID_MM = parseFloat(e.target.value);
    updateStatus();
    render();
});

function saveState() {
    const snapshot = {
        components: state.components.map(c => ({
            id: c.id, ref: c.ref, type: c.type, posMm: [...c.posMm], rotDeg: c.rotDeg, 
            params: JSON.parse(JSON.stringify(c.params)), customGeo: JSON.parse(JSON.stringify(c.customGeo))
        })),
        traces: state.traces.map(t => ({ startNode: {...t.startNode}, endNode: {...t.endNode} }))
    };
    state.undoStack.push(snapshot);
    if (state.undoStack.length > 50) state.undoStack.shift(); 
    state.redoStack = []; 
}

function loadSnapshot(snapshot) {
    state.components = snapshot.components.map(c => {
        let comp = new Component(c.ref, c.type, c.posMm, c.params, c.id);
        comp.rotDeg = c.rotDeg; comp.customGeo = c.customGeo; 
        return comp;
    });
    state.traces = snapshot.traces.map(t => new Trace(t.startNode, t.endNode));
    state.selected.clear(); render();
}

class Component {
    constructor(ref, type, posMm, params = {}, id = null) {
        this.id = id || Math.random().toString(36).substring(2, 11);
        this.ref = ref; this.type = type; this.posMm = [...posMm]; this.rotDeg = 0;
        this.fp = FOOTPRINTS[type] || null; this.isCustom = type.startsWith("Emb");
        this.params = params; this.customGeo = null;
        if (this.isCustom) this.generateCustomGeometry();
    }
    
    hitTest(wX, wY) {
        let w = 5, h = 5;
        if (this.fp) { w = this.fp.size[0]; h = this.fp.size[1]; }
        else if (this.customGeo && this.customGeo.paths && this.customGeo.paths.length > 0) {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            this.customGeo.paths.forEach(path => path.forEach(p => {
                if(p[0]<minX) minX=p[0]; if(p[0]>maxX) maxX=p[0];
                if(p[1]<minY) minY=p[1]; if(p[1]>maxY) maxY=p[1];
            }));
            w = maxX - minX; h = maxY - minY;
        }
        if (this.rotDeg % 180 !== 0) { let t = w; w = h; h = t; }
        return (Math.abs(wX - this.posMm[0]) <= w/2 + 1 && Math.abs(wY - this.posMm[1]) <= h/2 + 1);
    }

    getPadsAbsolute() {
        let pads = [];
        let rad = this.rotDeg * Math.PI / 180;
        let cosA = Math.cos(rad); let sinA = Math.sin(rad);

        if (this.fp && this.fp.pads) {
            for (let p of this.fp.pads) {
                let rx = p.rel[0] * cosA - p.rel[1] * sinA;
                let ry = p.rel[0] * sinA + p.rel[1] * cosA;
                pads.push([this.posMm[0] + rx, this.posMm[1] + ry]);
            }
        } else if (this.isCustom && this.customGeo && this.customGeo.snapPoints) {
            for (let p of this.customGeo.snapPoints) {
                let rx = p[0] * cosA - p[1] * sinA;
                let ry = p[0] * sinA + p[1] * cosA;
                pads.push([this.posMm[0] + rx, this.posMm[1] + ry]);
            }
        }
        return pads;
    }

    generateCustomGeometry() {
        this.customGeo = { paths: [], label: "", snapPoints: [] };
        let raw_paths = [];

        if (this.type === "EmbR") {
            let R = this.params.R || 300, rho = this.params.rho || 300;
            let total_length = (R / rho) * 1000;
            let pad_box_size = 1.6, pad_gap = 2.6, pad_offset = 3, step = 1;
            
            let radius = Math.sqrt(total_length / Math.PI);
            let pad_bottom_y = -radius - pad_offset;
            let left_pad_center_x = -pad_gap / 2 - pad_box_size / 2;
            let right_pad_center_x = pad_gap / 2 + pad_box_size / 2;

            let left_v_len = Math.abs(-radius - pad_bottom_y);
            let left_h_len = Math.abs(left_pad_center_x - (-radius));
            let right_v_len = Math.abs(-radius - pad_bottom_y);
            let right_h_len = Math.abs(right_pad_center_x - radius);

            let LR = total_length - (2 * pad_box_size + left_v_len + left_h_len + right_v_len + right_h_len);
            if (LR <= 0) { alert("Error: Thread length too short for pads."); return; }
            radius = Math.sqrt(LR / Math.PI);

            let main_path = []; let wave_len = 0, pts = [];
            for (let x = -radius; x <= radius + 0.001; x += step) {
                if (Math.abs(x) <= radius) {
                    let y = Math.sqrt(radius * radius - x * x);
                    let i = Math.round((x + radius) / step);
                    if (i % 2 === 0) { pts.push([x, y]); pts.push([x, -y]); } 
                    else { pts.push([x, -y]); pts.push([x, y]); }
                    wave_len += 2 * y;
                }
            }

            let scale = LR / wave_len;
            pts.forEach(p => { p[0] *= scale; p[1] *= scale; });
            if (pts.length > 0) { pts[0][0] = -radius; pts[pts.length - 1][0] = radius; }

            main_path.push([-radius, pad_bottom_y]); main_path.push([-radius, pts[0][1]]);
            main_path.push(...pts); main_path.push([radius, pts[pts.length - 1][1]]); main_path.push([radius, pad_bottom_y]);
            raw_paths.push(main_path);

            raw_paths.push([[-radius, pad_bottom_y], [left_pad_center_x, pad_bottom_y]]);
            raw_paths.push([[radius, pad_bottom_y], [right_pad_center_x, pad_bottom_y]]);

            for (let cx of [left_pad_center_x, right_pad_center_x]) {
                let px = cx - pad_box_size / 2, py = pad_bottom_y - pad_box_size / 2;
                for (let x = px; x <= px + pad_box_size + 0.001; x += step * 0.25) raw_paths.push([[x, py], [x, py + pad_box_size]]);
                for (let y = py; y <= py + pad_box_size + 0.001; y += step * 0.25) raw_paths.push([[px, y], [px + pad_box_size, y]]);
            }
            this.customGeo.label = R + "Ω";
            this.customGeo.snapPoints.push([left_pad_center_x, pad_bottom_y]);
            this.customGeo.snapPoints.push([right_pad_center_x, pad_bottom_y]);
        
        } else if (this.type === "EmbC") {
            let t = this.params.turns || 12; let l = this.params.length || 20;
            let thread_dia = 0.2, spacing = this.params.spacing || 0.70; let permittivity = this.params.permittivity || 1.5;
            let stitch_spacing = 1.5, dense_spacing = stitch_spacing / 2;

            let width = 2 * thread_dia; let line_dist = width + spacing;
            let img_width = (t + 1) * line_dist + 3.0; let lower_base_y = width + 5;
            let upper_base_y = lower_base_y + l + 2 * width + 1.25; let start_x = (img_width - line_dist * t) / 2;
            let pad_spacing = 8.0, pad_width = 2.0, pad_height = 2.0;
            let pad_x = start_x + t * line_dist + 3.0 - (pad_width / 2);
            let pad_y_lower = lower_base_y + pad_spacing; let pad_y_upper = upper_base_y - pad_spacing - 1.75;

            let path_lower = [], path_upper = [];

            for(let i=0; i <= Math.floor(pad_height / dense_spacing); i++) {
                let y = pad_y_lower + i * dense_spacing;
                if (i % 2 === 0) { path_lower.push([pad_x, y]); path_lower.push([pad_x + pad_width, y]); } 
                else { path_lower.push([pad_x + pad_width, y]); path_lower.push([pad_x, y]); }
            }
            path_lower.push([pad_x + pad_width/2, pad_y_lower + pad_height/2]); path_lower.push([pad_x + pad_width/2, lower_base_y]);

            for(let i=0; i<t; i++) {
                let x = start_x + line_dist * i; path_lower.push([x, lower_base_y]);
                if(i % 2 === 0) { path_lower.push([x, lower_base_y + l]); path_lower.push([x, lower_base_y]); }
            }

            for(let i=0; i <= Math.floor(pad_height / dense_spacing); i++) {
                let y = pad_y_upper + i * dense_spacing;
                if (i % 2 === 0) { path_upper.push([pad_x, y]); path_upper.push([pad_x + pad_width, y]); } 
                else { path_upper.push([pad_x + pad_width, y]); path_upper.push([pad_x, y]); }
            }
            path_upper.push([pad_x + pad_width/2, pad_y_upper + pad_height/2]); path_upper.push([pad_x + pad_width/2, upper_base_y]);

            for(let i=0; i<t; i++) {
                let x = start_x + line_dist * i; path_upper.push([x, upper_base_y]);
                if(i % 2 !== 0) { path_upper.push([x, upper_base_y - l]); path_upper.push([x, upper_base_y]); }
            }

            raw_paths.push(path_lower); raw_paths.push(path_upper);

            let cap = ((8.854 * permittivity * (2 * width + spacing) * l) / spacing) * (t - 1);
            this.customGeo.label = cap.toFixed(2) + " pF";
            
            this.customGeo.snapPoints.push([pad_x + pad_width/2, pad_y_lower + pad_height/2]);
            this.customGeo.snapPoints.push([pad_x + pad_width/2, pad_y_upper + pad_height/2]);
        }

        if (raw_paths.length > 0) {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            raw_paths.forEach(path => path.forEach(p => {
                if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
                if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
            }));
            let cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
            this.customGeo.paths = raw_paths.map(path => path.map(p => [p[0] - cx, p[1] - cy]));
            this.customGeo.snapPoints = this.customGeo.snapPoints.map(p => [p[0] - cx, p[1] - cy]);
        }
    }
    
    draw(ctx) {
        ctx.save(); ctx.translate(this.posMm[0], this.posMm[1]); ctx.rotate(this.rotDeg * Math.PI / 180);
        const isSel = state.selected.has(this);
        ctx.strokeStyle = isSel ? CONFIG.COLORS.SELECTED : CONFIG.COLORS.BODY_OUTLINE; ctx.fillStyle = CONFIG.COLORS.BODY_FILL;

        if (this.fp) {
            ctx.lineWidth = isSel ? 0.2 : 0.1;
            ctx.fillRect(-this.fp.size[0]/2, -this.fp.size[1]/2, this.fp.size[0], this.fp.size[1]);
            ctx.strokeRect(-this.fp.size[0]/2, -this.fp.size[1]/2, this.fp.size[0], this.fp.size[1]);
            ctx.fillStyle = CONFIG.COLORS.PAD_FILL; ctx.strokeStyle = CONFIG.COLORS.PAD_OUTLINE;
            for (let p of this.fp.pads) {
                ctx.fillRect(p.rel[0] - p.size[0]/2, p.rel[1] - p.size[1]/2, p.size[0], p.size[1]);
                ctx.strokeRect(p.rel[0] - p.size[0]/2, p.rel[1] - p.size[1]/2, p.size[0], p.size[1]);
            }
        } else if (this.isCustom && this.customGeo && this.customGeo.paths) {
            ctx.strokeStyle = isSel ? CONFIG.COLORS.SELECTED : (this.type==="EmbR" ? "blue" : "red"); ctx.lineWidth = 0.3;
            for (let path of this.customGeo.paths) {
                if (path.length === 0) continue;
                ctx.beginPath();
                ctx.moveTo(path[0][0], path[0][1]);
                for (let i = 1; i < path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
                ctx.stroke();
            }
        }

        ctx.rotate(-this.rotDeg * Math.PI / 180); ctx.fillStyle = "black"; ctx.textAlign = "center";
        let fontSize = Math.max(0.8, 8 / state.scale);
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.fillText(this.ref, 0, this.fp ? -this.fp.size[1]/2 - 0.5 : -2);
        
        if (this.customGeo && this.customGeo.label) {
            ctx.font = `italic ${fontSize * 0.9}px Arial`;
            ctx.fillStyle = "darkred";
            ctx.fillText(this.customGeo.label, 0, 3);
        }
        ctx.restore();
    }
}

class Trace {
    constructor(startNode, endNode) { 
        if (Array.isArray(startNode)) {
            this.startNode = { x: startNode[0], y: startNode[1], compId: null, padIndex: -1 };
            this.endNode = { x: endNode[0], y: endNode[1], compId: null, padIndex: -1 };
        } else { this.startNode = { ...startNode }; this.endNode = { ...endNode }; }
    }
    
    getStartPt() {
        if (this.startNode.compId) {
            let c = state.components.find(c => c.id === this.startNode.compId);
            if (c) return c.getPadsAbsolute()[this.startNode.padIndex] || [this.startNode.x, this.startNode.y];
        }
        return [this.startNode.x, this.startNode.y];
    }

    getEndPt() {
        if (this.endNode.compId) {
            let c = state.components.find(c => c.id === this.endNode.compId);
            if (c) return c.getPadsAbsolute()[this.endNode.padIndex] || [this.endNode.x, this.endNode.y];
        }
        return [this.endNode.x, this.endNode.y];
    }

    draw(ctx) {
        let s = this.getStartPt();
        let e = this.getEndPt();
        ctx.strokeStyle = state.selected.has(this) ? CONFIG.COLORS.SELECTED : CONFIG.COLORS.TRACE; 
        ctx.lineWidth = 0.5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(e[0], e[1]); ctx.stroke();
    }
}

const canvas = document.getElementById('pcbCanvas'); const ctx = canvas.getContext('2d'); const wrapper = document.getElementById('canvas-wrapper');

function resize() { canvas.width = wrapper.clientWidth; canvas.height = wrapper.clientHeight; render(); }
window.addEventListener('resize', resize);

function getSnappedRouteNode(wX, wY) {
    let tolerance = 0.8; 
    let bestDist = Infinity;
    let bestNode = null;

    for (let c of state.components) {
        let pads = c.getPadsAbsolute();
        for (let i = 0; i < pads.length; i++) {
            let p = pads[i];
            let dist = Math.hypot(wX - p[0], wY - p[1]);
            if (dist < tolerance && dist < bestDist) {
                bestDist = dist;
                bestNode = { x: p[0], y: p[1], compId: c.id, padIndex: i };
            }
        }
    }
    if (bestNode) return bestNode;
    return { x: Math.round(wX / CONFIG.GRID_MM) * CONFIG.GRID_MM, y: Math.round(wY / CONFIG.GRID_MM) * CONFIG.GRID_MM, compId: null, padIndex: -1 };
}

function getOrthogonalPath(startNode, endNode, sAbs, eAbs) {
    let dx = eAbs[0] - sAbs[0]; let dy = eAbs[1] - sAbs[1];
    
    if (Math.abs(dx) < 0.1 || Math.abs(dy) < 0.1 || Math.abs(Math.abs(dx) - Math.abs(dy)) < 0.1) {
        return [{...startNode, x: sAbs[0], y: sAbs[1]}, {...endNode, x: eAbs[0], y: eAbs[1]}];
    }
    
    let knee = {x: 0, y: 0, compId: null, padIndex: -1};
    
    if (state.routeMode === 0) { 
        if (Math.abs(dx) > Math.abs(dy)) {
            knee.x = eAbs[0] - Math.sign(dx) * Math.abs(dy);
            knee.y = sAbs[1];
        } else {
            knee.x = sAbs[0];
            knee.y = eAbs[1] - Math.sign(dy) * Math.abs(dx);
        }
    } else { 
        if (Math.abs(dx) > Math.abs(dy)) {
            knee.x = sAbs[0] + Math.sign(dx) * Math.abs(dy);
            knee.y = eAbs[1];
        } else {
            knee.x = eAbs[0];
            knee.y = sAbs[1] + Math.sign(dy) * Math.abs(dx);
        }
    }
    return [{...startNode, x: sAbs[0], y: sAbs[1]}, knee, {...endNode, x: eAbs[0], y: eAbs[1]}];
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.translate(state.offsetX, state.offsetY); ctx.scale(state.scale, state.scale);

    ctx.strokeStyle = CONFIG.COLORS.GRID; ctx.lineWidth = 1 / state.scale; ctx.beginPath();
    for(let x=0; x<=CONFIG.BOARD_W_MM; x+=CONFIG.GRID_MM) { ctx.moveTo(x, 0); ctx.lineTo(x, CONFIG.BOARD_H_MM); }
    for(let y=0; y<=CONFIG.BOARD_H_MM; y+=CONFIG.GRID_MM) { ctx.moveTo(0, y); ctx.lineTo(CONFIG.BOARD_W_MM, y); }
    ctx.stroke();

    ctx.strokeStyle = "black"; ctx.strokeRect(0, 0, CONFIG.BOARD_W_MM, CONFIG.BOARD_H_MM);
    state.traces.forEach(t => t.draw(ctx)); state.components.forEach(c => c.draw(ctx));

    if (state.tool === 'route' && state.routingStartNode) {
        const rawMouseMm = { x: (state.mousePx.x - state.offsetX) / state.scale, y: (state.mousePx.y - state.offsetY) / state.scale };
        const routeNode = getSnappedRouteNode(rawMouseMm.x, rawMouseMm.y);
        
        let startPt = [state.routingStartNode.x, state.routingStartNode.y];
        if (state.routingStartNode.compId) {
            let c = state.components.find(c => c.id === state.routingStartNode.compId);
            if (c) startPt = c.getPadsAbsolute()[state.routingStartNode.padIndex] || startPt;
        }

        let endPt = [routeNode.x, routeNode.y];
        if (routeNode.compId) {
            let c = state.components.find(c => c.id === routeNode.compId);
            if (c) endPt = c.getPadsAbsolute()[routeNode.padIndex] || endPt;
        }

        let path = getOrthogonalPath(state.routingStartNode, routeNode, startPt, endPt);

        ctx.strokeStyle = CONFIG.COLORS.ROUTING; ctx.setLineDash([0.5, 0.5]); ctx.lineWidth = 0.3;
        ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
        for(let i=1; i<path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore(); updateStatus();
}

let isPanning = false; let panStart = {x:0, y:0}; let draggingComp = null; let hasMoved = false;

canvas.addEventListener('mousedown', e => {
    if (e.button === 1 || (e.button === 0 && e.altKey)) { isPanning = true; panStart = { x: e.clientX - state.offsetX, y: e.clientY - state.offsetY }; return; }
    const rect = canvas.getBoundingClientRect(); const wX = (e.clientX - rect.left - state.offsetX) / state.scale; const wY = (e.clientY - rect.top - state.offsetY) / state.scale;
    const sX = Math.round(wX / CONFIG.GRID_MM) * CONFIG.GRID_MM; const sY = Math.round(wY / CONFIG.GRID_MM) * CONFIG.GRID_MM;

    if (state.tool === 'select') {
        state.selected.clear(); draggingComp = null; hasMoved = false;
        for (let c of [...state.components].reverse()) {
            if (c.hitTest(wX, wY)) { 
                state.selected.add(c); draggingComp = c; break; 
            }
        }
    } else if (state.tool.startsWith('place_')) {
        saveState(); 
        const typeStr = state.tool.replace('place_', '');
        
        let prefix = "U";
        if (typeStr.includes("R")) prefix = "R";
        if (typeStr.includes("C")) prefix = "C";
        if (typeStr.includes("PAD")) prefix = "P";
        
        let num = 1;
        while (state.components.find(c => c.ref === `${prefix}${num}`)) num++;
        
        let params = {};
        if (typeStr === 'EmbR') {
            let uR = prompt("Enter Resistance (Ohms):", "300");
            let uRho = prompt("Enter Resistivity (Ohms/m):", "300");
            if (uR && uRho) { params.R = parseFloat(uR); params.rho = parseFloat(uRho); }
            else { state.tool = 'select'; document.querySelector('[data-tool="select"]').click(); return; }
        } else if (typeStr === 'EmbC') {
            let uT = prompt("Enter Number of Turns (Fingers):", "12");
            let uL = prompt("Enter Finger Length (mm):", "20");
            let uS = prompt("Enter Finger Spacing (mm):", "0.70");
            let uP = prompt("Enter Relative Permittivity (Default 1.5):", "1.5");
            if (uT && uL && uS && uP) { 
                params.turns = parseInt(uT); params.length = parseFloat(uL);
                params.spacing = parseFloat(uS); params.permittivity = parseFloat(uP); 
            } else { state.tool = 'select'; document.querySelector('[data-tool="select"]').click(); return; }
        }

        state.components.push(new Component(`${prefix}${num}`, typeStr, [sX, sY], params));
        document.querySelector('[data-tool="select"]').click();
    } else if (state.tool === 'route') {
        const routeNode = getSnappedRouteNode(wX, wY); 
        if (!state.routingStartNode) {
            state.routingStartNode = routeNode;
        } else { 
            saveState(); 
            
            let startPt = [state.routingStartNode.x, state.routingStartNode.y];
            if (state.routingStartNode.compId) {
                let c = state.components.find(c => c.id === state.routingStartNode.compId);
                if (c) startPt = c.getPadsAbsolute()[state.routingStartNode.padIndex] || startPt;
            }

            let endPt = [routeNode.x, routeNode.y];
            if (routeNode.compId) {
                let c = state.components.find(c => c.id === routeNode.compId);
                if (c) endPt = c.getPadsAbsolute()[routeNode.padIndex] || endPt;
            }
            
            const path = getOrthogonalPath(state.routingStartNode, routeNode, startPt, endPt);
            
            if (path.length === 2) {
                state.traces.push(new Trace(path[0], path[1]));
            } else {
                state.traces.push(new Trace(path[0], path[1]));
                state.traces.push(new Trace(path[1], path[2]));
            }
            state.routingStartNode = routeNode; 
        }
    }
    render();
});

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect(); state.mousePx = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    if (isPanning) { state.offsetX = e.clientX - panStart.x; state.offsetY = e.clientY - panStart.y; render(); }
    else if (draggingComp && state.tool === 'select') {
        const wX = (e.clientX - rect.left - state.offsetX) / state.scale; const wY = (e.clientY - rect.top - state.offsetY) / state.scale;
        const newPos = [Math.round(wX / CONFIG.GRID_MM) * CONFIG.GRID_MM, Math.round(wY / CONFIG.GRID_MM) * CONFIG.GRID_MM];
        
        if (draggingComp.posMm[0] !== newPos[0] || draggingComp.posMm[1] !== newPos[1]) {
            if (!hasMoved) { saveState(); hasMoved = true; }
            draggingComp.posMm = newPos;
            render();
        }
    }
    else if (state.tool === 'route' && state.routingStartNode) render();
});

window.addEventListener('mouseup', () => { isPanning = false; draggingComp = null; hasMoved = false; });
canvas.addEventListener('wheel', e => {
    e.preventDefault(); const oldScale = state.scale; state.scale = Math.max(CONFIG.MIN_SCALE, Math.min(CONFIG.MAX_SCALE, state.scale * (e.deltaY < 0 ? 1.1 : 0.9)));
    const mx = e.clientX - canvas.getBoundingClientRect().left; const my = e.clientY - canvas.getBoundingClientRect().top;
    state.offsetX = mx - (mx - state.offsetX) * (state.scale / oldScale); state.offsetY = my - (my - state.offsetY) * (state.scale / oldScale); render();
});

canvas.addEventListener('contextmenu', e => { e.preventDefault(); if (state.tool === 'route') { state.routingStartNode = null; render(); } });

window.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === ' ') {
        if (state.tool === 'route' && state.routingStartNode) {
            state.routingStartNode = null;
            render();
            if (e.key === ' ') e.preventDefault();
        }
        return;
    }
    
    if (e.key.toLowerCase() === 'r' && state.tool === 'route') {
        state.routeMode = state.routeMode === 0 ? 1 : 0;
        render();
        return;
    }

    if (e.ctrlKey || e.metaKey) {
        if (e.key.toLowerCase() === 'z') {
            e.preventDefault();
            if (state.undoStack.length > 0) {
                const current = { components: state.components.map(c => ({ id: c.id, ref: c.ref, type: c.type, posMm: [...c.posMm], rotDeg: c.rotDeg, params: JSON.parse(JSON.stringify(c.params)), customGeo: JSON.parse(JSON.stringify(c.customGeo)) })), traces: state.traces.map(t => ({ startNode: {...t.startNode}, endNode: {...t.endNode} })) };
                state.redoStack.push(current); loadSnapshot(state.undoStack.pop()); updateStatus();
            }
        }
        else if (e.key.toLowerCase() === 'y') {
            e.preventDefault();
            if (state.redoStack.length > 0) {
                const current = { components: state.components.map(c => ({ id: c.id, ref: c.ref, type: c.type, posMm: [...c.posMm], rotDeg: c.rotDeg, params: JSON.parse(JSON.stringify(c.params)), customGeo: JSON.parse(JSON.stringify(c.customGeo)) })), traces: state.traces.map(t => ({ startNode: {...t.startNode}, endNode: {...t.endNode} })) };
                state.undoStack.push(current); loadSnapshot(state.redoStack.pop()); updateStatus();
            }
        }
        else if (e.key.toLowerCase() === 'a') {
            e.preventDefault(); state.selected.clear(); state.components.forEach(c => state.selected.add(c)); state.traces.forEach(t => state.selected.add(t)); render();
        } 
        else if (e.key.toLowerCase() === 'c') {
            e.preventDefault(); state.clipboard = [];
            state.selected.forEach(item => { if (item.ref) { state.clipboard.push({ type: item.type, posMm: [...item.posMm], rotDeg: item.rotDeg, params: JSON.parse(JSON.stringify(item.params)) }); } });
            updateStatus();
        }
        else if (e.key.toLowerCase() === 'v') {
            e.preventDefault();
            if (!state.clipboard || state.clipboard.length === 0) return;
            saveState(); state.selected.clear();
            state.clipboard.forEach(clip => {
                let prefix = "U";
                if (clip.type.includes("R")) prefix = "R"; if (clip.type.includes("C")) prefix = "C"; if (clip.type.includes("PAD")) prefix = "P";
                let num = 1; while (state.components.find(c => c.ref === `${prefix}${num}`)) num++;
                let newPos = [clip.posMm[0] + CONFIG.GRID_MM, clip.posMm[1] + CONFIG.GRID_MM];
                let newComp = new Component(`${prefix}${num}`, clip.type, newPos, clip.params);
                newComp.rotDeg = clip.rotDeg; state.components.push(newComp); state.selected.add(newComp); clip.posMm = newPos; 
            });
            render();
        }
        else if (e.key.toLowerCase() === 'd') {
            e.preventDefault(); document.getElementById('btn-delete').click();
        }
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
        if (state.selected.size > 0) document.getElementById('btn-delete').click();
    }
});

document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', e => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); e.target.classList.add('active');
        state.tool = e.target.dataset.tool; state.routingStartNode = null; updateStatus();
    });
});

document.getElementById('btn-rotate').addEventListener('click', () => {
    saveState(); state.selected.forEach(c => { if(c instanceof Component) c.rotDeg = (c.rotDeg + 90) % 360; }); render();
});

document.getElementById('btn-delete').addEventListener('click', () => {
    saveState(); state.components = state.components.filter(c => !state.selected.has(c)); state.traces = state.traces.filter(t => !state.selected.has(t));
    state.selected.clear(); render();
});

function updateStatus() { 
    let msg = `Tool: ${state.tool} | Grid: ${CONFIG.GRID_MM}mm | Zoom: ${state.scale.toFixed(1)}x | Press 'R' to flip routing angle | Selected: ${state.selected.size}`;
    if (state.clipboard.length > 0) msg += ` | Copied: ${state.clipboard.length}`;
    document.getElementById('statusbar').innerText = msg;
}

document.getElementById('btn-save').addEventListener('click', () => {
    const data = JSON.stringify({ components: state.components.map(c => ({id: c.id, ref: c.ref, type: c.type, posMm: c.posMm, rotDeg: c.rotDeg, params: c.params, customGeo: c.customGeo})), traces: state.traces.map(t => ({startNode: t.startNode, endNode: t.endNode})) }, null, 2);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: "application/json"})); a.download = "layout.embpcb"; a.click();
});

document.getElementById('file-input').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
    reader.onload = ev => {
        try {
            saveState(); 
            const data = JSON.parse(ev.target.result);
            state.components = data.components.map(c => { let comp = new Component(c.ref, c.type, c.posMm, c.params, c.id); comp.rotDeg = c.rotDeg; comp.customGeo = c.customGeo; return comp; });
            state.traces = data.traces.map(t => new Trace(t.startNode || t.startMm, t.endNode || t.endMm)); state.selected.clear(); render();
        } catch (err) { alert("Invalid file format."); }
    }; reader.readAsText(file);
});

document.getElementById('btn-new').addEventListener('click', () => { if(confirm("Clear the board?")) { saveState(); state.components = []; state.traces = []; state.selected.clear(); render(); } });

document.getElementById('btn-export-dst').addEventListener('click', async () => {
    const status = document.getElementById('statusbar'); status.innerText = "Exporting... Please wait.";

    // Securely push the actual params (R, rho, length, turns, etc.) back to Python
    const payload = {
        components: state.components.map(c => ({ 
            ref: c.ref, posMm: c.posMm, rotDeg: c.rotDeg, type: c.type, 
            params: c.params, 
            pads: c.fp ? c.fp.pads : [], customGeo: c.customGeo 
        })),
        traces: state.traces.map(t => ({ startMm: t.getStartPt(), endMm: t.getEndPt() }))
    };

    try {
        // NOTE: Make sure this URL matches your PythonAnywhere URL!
        const response = await fetch('https://xian49930.pythonanywhere.com/export-dst', { 
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) 
        });
        if (!response.ok) throw new Error("Backend server error.");
        const blob = await response.blob(); const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = "layout_export.dst"; document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url);
        updateStatus(); alert("Export Successful!");
    } catch (err) { alert("Error: Make sure your Python backend is running!\n" + err.message); updateStatus(); }
});

resize();
state.offsetX = (canvas.width - (CONFIG.BOARD_W_MM * state.scale)) / 2;
state.offsetY = (canvas.height - (CONFIG.BOARD_H_MM * state.scale)) / 2;
render();
</script>
</body>
</html>
